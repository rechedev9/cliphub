# Cheap PR/main quality lane for Studio UI packages.
# Not HLAE/CS2 E2E. Do not assemble or dist the Windows installer here.
name: CI frontend

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'web/**'
      - 'desktop/**'
      - '.github/workflows/ci-frontend.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install web and desktop dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Web typecheck, lint, unit
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run test:unit

      - name: Desktop typecheck, lint, unit
        run: |
          pnpm --dir desktop run typecheck
          pnpm --dir desktop run lint
          pnpm --dir desktop run test:unit

