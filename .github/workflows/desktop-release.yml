# The only hosted workflow in the repo: checks, then the unsigned Windows Studio installer.
# There is no CI on pushes or PRs; a release only publishes when checks pass. Do not add a second workflow.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Optional release notes. Empty uses the unsigned-installer default.
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

# Each job asks for its own token scope. Only publish can write, so the build (third-party
# packages and scripts) never holds a token that can change releases.
permissions: {}

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install web and desktop dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Go vet, test, zv check
        # -short skips the FFmpeg renders: they need Studio's FFmpeg 8.1.2, not the runner's.
        run: |
          go vet ./...
          go test -short ./... -count=1 -timeout 12m
          go run ./cmd/zv check

      - name: Capture simulator contracts
        run: node --test scripts/capturelab/*.test.mjs

      - name: Web typecheck, lint, unit
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run test:unit

      - name: Desktop typecheck, lint, unit
        run: |
          pnpm --dir desktop run typecheck
          pnpm --dir desktop run lint
          pnpm --dir desktop run test:unit

  windows-installer:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and check the Studio version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "invalid desktop version: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $($env:GITHUB_REF_NAME) does not match desktop/package.json $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install web and desktop dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Require the latest HLAE release in the installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --no-warnings desktop/scripts/check-hlae-latest.mjs

      - name: Cache bundled Suno music
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/music/*.mp3
          key: studio-suno-music-${{ hashFiles('data/music/catalog.json') }}

      - name: Seed bundled music from the last published installer
        run: node desktop/scripts/seed-bundled-music.mjs

      - name: Build unsigned Windows installer
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: pnpm --dir desktop run dist

      - name: Verify release checksums
        run: pnpm --dir desktop run verify:dist-integrity

      - name: Keep the release assets for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-installer
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            desktop/dist-installer/ClipHub.Studio.Setup.${{ steps.version.outputs.version }}.exe
            desktop/dist-installer/ClipHub.Studio.Setup.${{ steps.version.outputs.version }}.exe.blockmap
            desktop/dist-installer/SHA256SUMS.txt

  publish:
    needs: [checks, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release environment only accepts main and v* tags (repo Settings → Environments).
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-installer
          path: dist

      - name: Check the downloaded assets against SHA256SUMS.txt
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.inputs.notes || '' }}
          VERSION: ${{ needs.windows-installer.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:VERSION
          $tag = "v$version"
          $exe = "dist/ClipHub.Studio.Setup.$version.exe"
          $assets = @($exe, "$exe.blockmap", 'dist/SHA256SUMS.txt')

          $notes = $env:RELEASE_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Studio $version is the unsigned Windows installer built by this repository's windows-latest job.`n`nUnsigned by policy; verify SHA256SUMS.txt."
          }

          # A new release stays a draft until every asset is uploaded, so a partial run is never public.
          $release = gh release view $tag --json assets 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "ClipHub Studio $version" --notes $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit $LASTEXITCODE" }
            $release = @{ assets = @() }
          }

          # Published assets are never replaced: a re-run skips the ones already there with the
          # same digest and fails on any other copy.
          $missing = @(foreach ($path in $assets) {
            $name = Split-Path -Leaf $path
            $published = $release.assets | Where-Object name -eq $name
            if (-not $published) { $path; continue }
            $digest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($published.digest -ne $digest) { throw "$name is already published with a different digest" }
          })
          if ($missing.Count -gt 0) {
            gh release upload $tag @missing
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit $LASTEXITCODE" }
          }
          gh release edit $tag --title "ClipHub Studio $version" --notes $notes --latest --draft=false --prerelease=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit $LASTEXITCODE" }
