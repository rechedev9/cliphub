# Light checks on pull requests and on pushes to main.
# The installer, Studio's FFmpeg, the full Go suite and TestNoDeadCode stay in
# desktop-release.yml. -short skips the slow FFmpeg renders and TestNoDeadCode.
# Tests that call ffmpeg or ffprobe skip when those binaries are absent, and
# nothing here needs HLAE or CS2, so this workflow does not install them.
name: PR checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet, short test, zv check
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -short ./... -count=1 -timeout 10m
          go run ./cmd/zv check

  web-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install web and desktop dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Web typecheck, lint, unit
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run lint
          pnpm --dir web run test:unit

      - name: Desktop typecheck, lint, unit
        run: |
          pnpm --dir desktop run typecheck
          pnpm --dir desktop run lint
          pnpm --dir desktop run test:unit
