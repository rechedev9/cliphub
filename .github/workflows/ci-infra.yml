# Cheap PR/main check of hosted pipeline YAML and the unsigned-release contract.
# Not product E2E. Does not cut a Windows installer.
name: CI infra

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate hosted pipelines
        run: bash scripts/ci-infra.sh

      - name: Build and test chperf
        run: sh tools/chperf/build.sh test
