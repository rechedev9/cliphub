# Cheap PR/main quality lane for the Go pipeline contract.
# Not HLAE/CS2 E2E. Does not start Redis/asynq; tests use the in-process queue.
name: CI backend

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'effects/**'
      - 'testdata/**'
      - '.claude/**'
      - 'scripts/go-*.sh'
      - 'scripts/capturelab/**'
      - 'scripts/ci-backend-*'
      - '.github/workflows/ci-backend.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'effects/**'
      - 'testdata/**'
      - '.claude/**'
      - 'scripts/go-*.sh'
      - 'scripts/capturelab/**'
      - 'scripts/ci-backend-*'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node for the capture simulator
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Capture simulator contracts
        run: node --test scripts/capturelab/*.test.mjs scripts/ci-backend-evidence.test.mjs

      - name: go vet
        run: go vet ./...

      - name: go test
        shell: bash
        run: go test ./... -count=1 -timeout 5m -json | tee "$RUNNER_TEMP/backend-tests.jsonl"

      - name: Require critical flow evidence
        if: ${{ !cancelled() }}
        run: node scripts/ci-backend-evidence.mjs "$RUNNER_TEMP/backend-tests.jsonl"

      - name: zv check
        run: go run ./cmd/zv check
