# Cheap PR/main quality lane for the Go pipeline contract.
# Not HLAE/CS2 E2E. Does not start Redis/asynq; tests use the in-process queue.
name: CI backend

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'effects/**'
      - 'testdata/**'
      - 'scripts/go-*.sh'
      - 'scripts/capturelab/**'
      - 'scripts/telemetry-debug.mjs'
      - 'desktop/src/diagnostic*'
      - 'desktop/src/process-*'
      - 'desktop/src/telemetry-settings.ts'
      - 'desktop/src/remote-debug.test.mjs'
      - '.github/workflows/ci-backend.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Setup Node for the capture simulator
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Capture simulator contracts
        run: node --test scripts/capturelab/*.test.mjs

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 8m

      - name: zv check
        run: go run ./cmd/zv check

      - name: Remote diagnostic delivery contract
        run: node --no-warnings --test desktop/src/remote-debug.test.mjs desktop/scripts/telemetry-debug.test.mjs
