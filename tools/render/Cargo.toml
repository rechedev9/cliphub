[package]
name = "cliphub-render"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = "0.49.0"
vello = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
