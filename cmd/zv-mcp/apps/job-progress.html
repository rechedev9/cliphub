<title>Progreso de ClipHub Studio</title>
<style>/* Studio tokens (web/app/globals.css), light and dark, kept inline so the view has no network. */
:root {
  color-scheme: light;
  --surface: oklch(1 0 0);
  --surface-raised: oklch(0.965 0.002 264);
  --fg-1: oklch(0.21 0.006 264);
  --fg-2: oklch(0.43 0.008 264);
  --border: oklch(0.9 0.004 264);
  --brand-accent: oklch(0.6 0.2 25);
  --success: oklch(0.52 0.12 160);
  --destructive: oklch(0.53 0.2 25);
  --radius: 0.5rem;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: oklch(0.212 0.004 264);
  --surface-raised: oklch(0.245 0.004 264);
  --fg-1: oklch(0.96 0.002 264);
  --fg-2: oklch(0.79 0.004 264);
  --border: oklch(1 0 0 / 0.1);
  --brand-accent: oklch(0.68 0.21 25);
  --success: oklch(0.76 0.11 158);
  --destructive: oklch(0.68 0.16 22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: oklch(0.212 0.004 264);
    --surface-raised: oklch(0.245 0.004 264);
    --fg-1: oklch(0.96 0.002 264);
    --fg-2: oklch(0.79 0.004 264);
    --border: oklch(1 0 0 / 0.1);
    --brand-accent: oklch(0.68 0.21 25);
    --success: oklch(0.76 0.11 158);
    --destructive: oklch(0.68 0.16 22);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body {
  color: var(--fg-1);
  font: 0.875rem/1.45 "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem 0.875rem;
}
.head { display: flex; align-items: baseline; gap: 0.5rem; }
.title { font-size: 0.9375rem; font-weight: 600; }
.percent { font-weight: 600; color: var(--fg-1); }
.elapsed { margin-left: auto; color: var(--fg-2); font-size: 0.8125rem; }

.track {
  position: relative;
  height: 0.375rem;
  margin-top: 0.5rem;
  border-radius: 999px;
  background: var(--surface-raised);
  overflow: hidden;
}
.fill {
  height: 100%;
  border-radius: inherit;
  background: var(--brand-accent);
  transition: width 600ms var(--ease-standard);
}
[data-phase="done"] .fill { background: var(--success); }
[data-phase="failed"] .fill { background: var(--destructive); }
.track[data-indeterminate] .fill { animation: slide 1.2s var(--ease-standard) infinite; }
@keyframes slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(340%); }
}
@media (prefers-reduced-motion: reduce) {
  .fill { transition: none; }
  .track[data-indeterminate] .fill { animation: none; opacity: 0.6; }
}

.detail, .video, .note { margin: 0.375rem 0 0; }
.detail { color: var(--fg-2); }
.video { font-weight: 600; overflow-wrap: anywhere; }
[data-phase="failed"] .detail { color: var(--destructive); }
.note { color: var(--fg-2); font-size: 0.75rem; }
</style>
