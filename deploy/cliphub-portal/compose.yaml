name: cliphub-portal

services:
  portal:
    build:
      context: ../../portal
      dockerfile: ../deploy/cliphub-portal/Dockerfile
    restart: unless-stopped
    environment:
      # Auth.js. AUTH_TRUST_HOST is required behind a reverse proxy.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:?set AUTH_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      # Who may reach /admin, as provider:providerAccountId pairs.
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:?set ADMIN_ACCOUNTS}
      DATABASE_URL: file:/data/portal.db
      UPLOAD_DIR: /uploads
      MIGRATIONS_DIR: /app/db/migrations
      # Cloud capture. Worker credentials are created in /admin, not set here.
      # New accounts wait for an admin to allow them unless this is "allowed".
      CLOUD_ACCESS_DEFAULT: ${CLOUD_ACCESS_DEFAULT:-pending}
      CLOUD_KINDS: ${CLOUD_KINDS:-short}
      # Per-user limits; each can be overridden per user in /admin.
      MAX_ACTIVE_REQUESTS_PER_USER: ${MAX_ACTIVE_REQUESTS_PER_USER:-3}
      MAX_DAILY_SECONDS_PER_USER: ${MAX_DAILY_SECONDS_PER_USER:-5400}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-80}
      # File sizes. Results arrive in parts, so no request is larger than one part.
      MAX_DEMO_BYTES: ${MAX_DEMO_BYTES:-734003200}
      # Distinct demos one user may have stored at a time.
      MAX_DEMO_BYTES_PER_USER: ${MAX_DEMO_BYTES_PER_USER:-3221225472}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-1073741824}
      MAX_FULL_DEMO_ARTIFACT_BYTES: ${MAX_FULL_DEMO_ARTIFACT_BYTES:-8589934592}
      ARTIFACT_PART_BYTES: ${ARTIFACT_PART_BYTES:-33554432}
      # Below this much free space on /uploads the portal refuses new jobs and demo
      # uploads. Claims stop only under the lower floor, so the queue keeps draining.
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-10737418240}
      MIN_FREE_BYTES_CLAIM: ${MIN_FREE_BYTES_CLAIM:-2147483648}
      # Retention. RETENTION_DAYS only covers videos of the old manual flow.
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-7}
      FAILED_DEMO_RETENTION_HOURS: ${FAILED_DEMO_RETENTION_HOURS:-48}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # A job goes back to the queue when its worker is silent for this long.
      LEASE_SECONDS: ${LEASE_SECONDS:-90}
      # A worker with this many uploads pending gets no new job until one ends.
      MAX_UPLOAD_BACKLOG: ${MAX_UPLOAD_BACKLOG:-3}
    ports:
      # Loopback only; Caddy on the host terminates TLS and proxies here.
      - 127.0.0.1:8092:3000
    volumes:
      - portal-data:/data
      - portal-uploads:/uploads
    networks:
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Streamed uploads go straight to /uploads, never through /tmp, so this
      # only needs room for scratch. Next writes its fetch cache under .next.
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=0755,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  # Outbound only, for the OAuth token exchanges with Google and Discord.
  # Deliberately shares nothing with the Gravity Room or Fragbot stacks.
  egress:

volumes:
  portal-data:
  portal-uploads:
