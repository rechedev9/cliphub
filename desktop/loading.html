<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      Strict CSP: this page loads with no network access and needs none.
      style-src 'unsafe-inline' is only for the <style> block below; the
      main-process executeJavaScript() calls that update #status inject via
      the debugger protocol, not a page <script>, so script-src 'none' (the
      default-src fallback) does not block them.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>ClipHub Studio</title>
    <style>
      /* The dark tokens of web/app/globals.css (Studio's default theme),
         inlined because this page loads before the web server exists. */
      :root {
        --surface-1: oklch(0.185 0.003 264);
        --fg-1: oklch(0.96 0.002 264);
        --fg-2: oklch(0.79 0.004 264);
        --fg-3: oklch(0.68 0.005 264);
        --border: oklch(1 0 0 / 0.1);
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: var(--surface-1);
        color: var(--fg-1);
        font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 28rem; padding: 0 24px; text-align: center; }
      .wordmark { font: 600 20px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
      .spinner {
        width: 22px; height: 22px; margin: 22px 0 12px;
        border: 2px solid var(--border);
        border-top-color: var(--fg-2);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status { font-size: 14px; color: var(--fg-1); }
      .muted { font-size: 12.5px; color: var(--fg-3); }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="wordmark">ClipHub Studio</div>
      <div class="spinner"></div>
      <!-- id="status": main.js's setLoadingStatus() updates this textContent as boot
           progresses (choosing ports, provisioning tools, starting each server). -->
      <div class="status" id="status">Arrancando ClipHub Studio</div>
      <div class="muted">El primer arranque descarga las herramientas (unos 110 MB). Los siguientes son inmediatos.</div>
    </div>
  </body>
</html>
