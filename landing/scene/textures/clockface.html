<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet"><style>
*{margin:0} body{width:512px;height:512px;background:#efece4;position:relative;font-family:Anton;overflow:hidden}
.n{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;text-align:center;line-height:60px;font-size:50px;color:#1d1d1d}
.k{position:absolute;left:254px;top:24px;width:4px;height:16px;background:#1d1d1d;transform-origin:2px 232px}
.b{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:"Courier Prime";font-size:22px;color:#666;letter-spacing:3px}
</style></head><body><div class="b">QUARTZ</div><script>
for(let i=0;i<60;i++){const k=document.createElement('div');k.className='k';k.style.transform='rotate('+i*6+'deg)';if(i%5)k.style.height='9px',k.style.width='2px';document.body.appendChild(k)}
for(let h=1;h<=12;h++){const a=h*Math.PI/6,n=document.createElement('div');n.className='n';n.textContent=h;n.style.left=256+Math.sin(a)*176+'px';n.style.top=256-Math.cos(a)*176+'px';document.body.appendChild(n)}
</script></body></html>
