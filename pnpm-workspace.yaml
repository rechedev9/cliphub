packages:
  - web
  - desktop
  - landing
  - mcp-apps
  - tools/hltv-harvester

# Next's standalone output is copied into the Studio installer and the ClipMind web image, which
# need a plain tree of real files. A hoisted (flat) node_modules gives that, and
# web/scripts/flatten-standalone.mjs moves the monorepo-nested server to the standalone root.
nodeLinker: hoisted

catalog:
  "@tailwindcss/postcss": ^4.3.2
  "@types/node": ^22.10.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  oxlint: ^1.91.0
  oxlint-tsgolint: ^0.24.0
  react: ^19.0.0
  react-dom: ^19.0.0
  tailwindcss: ^4.3.2
  typescript: ^5.7.0

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

overrides:
  # GHSA-rgw5-rvv9-x895 (CVE-2026-69152): 5.0.8's DoS mitigation is
  # incomplete; 5.0.9 bounds the intermediate arrays too. 5.0.12 closes a later advisory.
  brace-expansion: 5.0.12
  # GHSA-* (undici): dev-time download/build tooling, pinned to patched minors.
  "@electron/get>undici": 7.30.1
  "node-gyp>undici": 6.29.1
  # GHSA-jqff-g426-hqxp and siblings (fast-uri): dev-time schema tooling (ajv).
  "ajv>fast-uri": 3.1.9
  # Dependabot high (http-cache-semantics <= 4.2.0): got cache inside @electron/get.
  http-cache-semantics: 4.3.0
  # GHSA-* (@xmldom/xmldom): plist parsing inside electron-builder packaging.
  "@xmldom/xmldom": 0.8.15
  # GHSA-2883-xcg3-v3hh (js-yaml): electron-builder config parsing.
  "js-yaml@4": 4.3.2
  # Dependabot 152 (minimatch globparts DoS, >= 7 < 11.0.1): electron-builder's file matching.
  "minimatch@>=7.0.0 <11.0.1": 11.0.3
  # CVE-2026-69153 / GHSA-fxqj-rqcc-2cmp: 8.5.19 is below the patched 8.5.23.
  postcss: 8.5.23
  # Dependabot high (source-map-js < 1.2.2, sharp < 0.35.5): transitive through Next.
  source-map-js: 1.2.2
  sharp: 0.35.5

minimumReleaseAgeExclude:
  - "@xmldom/xmldom@0.8.15"
  - js-yaml@4.3.2

patchedDependencies:
  brace-expansion@5.0.12: desktop/patches/brace-expansion@5.0.12.patch
