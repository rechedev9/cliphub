<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'none'">
<title>Match scoreboard</title><style>
@font-face{font-family:Roboto;src:url('{{.RegularFont}}') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Roboto;src:url('{{.MediumFont}}') format('truetype');font-weight:500;font-display:block}
@font-face{font-family:Roboto;src:url('{{.BoldFont}}') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}body{font-family:Roboto,Arial,sans-serif;color:#d9d9e0;-webkit-font-smoothing:antialiased}body.preview{background:#808080}
.board{position:absolute;left:70px;top:70px;width:1780px;height:940px;border:2px solid #d99aff;border-radius:12px;padding:24px 30px;background:#0a090df5;box-shadow:0 0 5px #ead1ff,0 0 22px #a51aef,inset 0 0 20px #72009e55}
.heading{display:flex;align-items:center;justify-content:space-between;height:54px;margin:0 0 8px;color:#f1eaf9;font-weight:700;font-size:28px}.map{font-size:18px;letter-spacing:3px;color:#ac93c4}
.team{margin-bottom:24px}.team-heading{display:flex;align-items:center;height:58px;gap:18px;font-size:24px;font-weight:700}.team-name{max-width:1000px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.score{min-width:36px;font-variant-numeric:tabular-nums;color:#e6e1ed}.winner .score{color:#b7ff75}.average{margin-left:auto;color:#92909c;font-weight:400;font-size:17px}.average strong{margin-left:12px;color:#cfcbd8}
.row{display:grid;grid-template-columns:320px 140px repeat(13,minmax(0,1fr));height:54px;align-items:center;background:#151419;border-bottom:2px solid #09090c;font-size:20px;font-variant-numeric:tabular-nums;border-radius:4px;overflow:hidden}
.row.header{height:40px;background:#242229;color:#b1a8bf;font-size:16px;font-weight:700}.row>div{text-align:center;min-width:0}.row>div:first-child{text-align:left;padding-left:14px}.row.pov{background:#29203b;box-shadow:inset 3px 0 #cd94ff}.identity{display:flex;align-items:center;gap:12px;font-weight:700}.avatar{width:38px;height:38px;object-fit:cover;border-radius:50%;background:#302936;flex-shrink:0}.name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pov-tag{font-size:11px;color:#dcafff;margin-left:1px;flex-shrink:0}.rank{display:flex;align-items:center;justify-content:center;gap:11px;font-size:18px}.level{display:flex;align-items:center;justify-content:center;width:29px;height:29px;border:3px solid #ff2b1d;border-radius:50%;color:#ff493c;font-size:14px;font-weight:700}.footer{position:absolute;bottom:19px;left:32px;font-size:14px;color:#83758f}
</style></head>{{template "scoreboard-body" .}}</html>
