<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'none'">
<title>FACEIT player introduction</title>
<style>
@font-face{font-family:Roboto;src:url('{{.RegularFont}}') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Roboto;src:url('{{.MediumFont}}') format('truetype');font-weight:500;font-display:block}
@font-face{font-family:Roboto;src:url('{{.BoldFont}}') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent}body{font-family:Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eeeef2}body.preview{background:#808080}
.roster{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 50%}
.panel{position:absolute;top:20px;width:568px;height:1040px;padding:18px 26px 20px;border:3px solid #e69bff;border-radius:9px;background:linear-gradient(180deg,rgba(20,16,27,.98),rgba(8,8,10,.99) 38%);box-shadow:0 0 3px 1px #fce0ff,0 0 8px 4px #d34bff,0 0 20px 8px #9c00fa,0 0 37px 11px #a000db80,inset 0 0 4px 1px #d977ff,inset 0 0 17px 6px #ab08fba8,inset 0 0 36px 9px #7200a650;transform-style:preserve-3d}
.panel.left{left:30px;transform-origin:left center;transform:rotateY(10deg)}
.panel.right{right:30px;transform-origin:right center;transform:rotateY(-10deg)}
.panel h2{font-size:20px;line-height:24px;font-weight:700;margin:0 0 27px 3px;color:#d8d5df}
.players{display:grid;grid-template-rows:repeat(5,162px);row-gap:32px}
.player{position:relative;margin-left:78px;width:432px;height:162px;border:1px solid #ffffff0f;border-radius:5px;background:linear-gradient(110deg,#151518,#111114);box-shadow:0 2px 6px #0005}
.portrait{position:absolute;left:-78px;top:-22px;width:82px;height:112px;object-fit:cover;border-radius:6px;border:1px solid #ffffff17;background:#1e1b24;box-shadow:1px 2px 5px #0005}
.portrait.placeholder{display:flex;align-items:center;justify-content:center}.portrait.placeholder svg{width:46px;height:46px;color:#74707f}
.identity{height:65px;display:flex;align-items:center;padding:0 11px 0 15px;gap:10px;min-width:0}
.nickname-group{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.name{font-size:21px;line-height:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.premium{width:18px;height:20px;color:#ff5c22;flex-shrink:0;margin-right:1px}
.verified{width:18px;height:18px;color:#ececf1;flex-shrink:0}
.flag{width:23px;height:17px;object-fit:fill;border-radius:1px;flex-shrink:0;margin-left:1px}
.rating{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0;color:#88888f;font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.trend{width:20px;height:16px;color:#56565c}
.rank{height:38px;min-width:72px;padding:0 5px 0 9px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:3px;color:#21121b;font-weight:700;font-size:17px;letter-spacing:-.35px;flex-shrink:0;background:#f51f48}
.rank.gold{background:#ffd73f;color:#282315}.rank.silver{background:#cdd7e3}.rank.bronze{background:#f79a50}.rank svg{width:27px;height:27px;flex-shrink:0}
.level{height:36px;width:36px;display:flex;align-items:center;justify-content:center;border:4px solid #ff2412;border-radius:50%;font-size:18px;font-weight:700;color:#ff2412;margin:0 4px 0 12px;flex-shrink:0}
.statistics{height:96px;border-top:1px solid #ffffff06;background:#232326;border-radius:0 0 5px 5px;padding:9px 8px 10px;color:#88888e}
.scope{display:grid;grid-template-columns:114px 1fr;font-size:10px;line-height:12px;font-weight:700;margin-bottom:16px}
.numbers{display:grid;grid-template-columns:104px 76px 128px 1fr;column-gap:0;min-width:0}
.stat{padding-left:10px;border-left:1px solid #ffffff0b;min-width:0}.stat:first-child{padding-left:0;border:0}
.value{font-size:20px;line-height:24px;white-space:nowrap;color:#b8b8bf;font-weight:500;letter-spacing:-.35px;font-variant-numeric:tabular-nums}.stat:nth-child(3) .value{font-size:19px}.stat:last-child .value{font-size:18px}
.label{font-size:10px;line-height:13px;margin-top:4px;font-weight:500;white-space:nowrap}.match-numbers{grid-template-columns:1.2fr 1fr 1fr}
svg{display:block}.symbol-library{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
{{template "intro-body" .}}
</html>
