<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'none'">
<title>Capturas del overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}body.preview{background:#808080}
.team{position:absolute;top:54px;width:576px;height:972px;display:flex;align-items:center;justify-content:center}
.left{left:38.4px}.right{right:38.4px}img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px #0009)}
.scoreboard{position:absolute;left:76.8px;top:86.4px;width:1766.4px;height:907.2px;display:flex;align-items:center;justify-content:center}
</style></head><body{{if .PreviewGrey}} class="preview"{{end}}>
{{if .Outro}}{{if .Scoreboard}}<div class="scoreboard"><img src="{{.Scoreboard}}" alt="Marcador final"></div>{{end}}
{{else}}{{if .Left}}<div class="team left"><img src="{{.Left}}" alt="Equipo 1"></div><div class="team right"><img src="{{.Right}}" alt="Equipo 2"></div>{{end}}{{end}}
</body></html>
