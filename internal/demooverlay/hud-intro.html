<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'none'"/>
<title>Player introduction</title>
<style>
@font-face{font-family:Roboto;src:url('{{.RegularFont}}') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Roboto;src:url('{{.MediumFont}}') format('truetype');font-weight:500;font-display:block}
@font-face{font-family:Roboto;src:url('{{.BoldFont}}') format('truetype');font-weight:700;font-display:block}
{{with .Palette}}:root{--ct:#{{.CT}};--t:#{{.T}};--bg:#{{.Background}};--text:#{{.Text}};--muted:#{{.Muted}};--radius:{{.Radius}}px}{{end}}
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent}body{font-family:Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}body.preview{background:#808080}
.roster{position:absolute;inset:0}
.panel{--side:var(--ct);position:absolute;top:20px;width:568px;height:1040px;padding:18px 26px 20px;border-top:6px solid var(--side);border-radius:var(--radius);background:color-mix(in srgb,var(--bg) 94%,transparent);box-shadow:0 18px 48px #0009}
.panel[data-side="T"]{--side:var(--t)}.panel.left{left:30px}.panel.right{right:30px}
.panel h2{font-size:20px;line-height:24px;font-weight:700;margin:0 0 27px 3px;color:var(--side);text-transform:uppercase;letter-spacing:2px}
.players{display:grid;grid-template-rows:repeat(5,162px);row-gap:32px}
.player{position:relative;margin-left:78px;width:432px;height:162px;border-radius:calc(var(--radius) * .6);background:color-mix(in srgb,var(--text) 6%,var(--bg));box-shadow:0 2px 6px #0005}
.player.pov{background:color-mix(in srgb,var(--side) 20%,var(--bg));box-shadow:inset 6px 0 var(--side),0 0 0 2px var(--side),0 2px 6px #0005}
.portrait{position:absolute;left:-78px;top:-22px;width:82px;height:112px;object-fit:cover;border-radius:calc(var(--radius) * .6);border:2px solid var(--side);background:color-mix(in srgb,var(--text) 10%,var(--bg));box-shadow:1px 2px 5px #0005}
.portrait.placeholder{display:flex;align-items:center;justify-content:center}.portrait.placeholder svg{width:46px;height:46px;color:var(--muted)}
.identity{height:65px;display:flex;align-items:center;padding:0 11px 0 15px;gap:10px;min-width:0}
.nickname-group{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.name{font-size:21px;line-height:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.premium{width:18px;height:20px;color:var(--t);flex-shrink:0;margin-right:1px}
.verified{width:18px;height:18px;color:var(--text);flex-shrink:0}
.flag{width:23px;height:17px;object-fit:fill;border-radius:1px;flex-shrink:0;margin-left:1px}
.rating{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0;color:var(--muted);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.trend{width:20px;height:16px;color:var(--muted)}
.rank{height:38px;min-width:72px;padding:0 5px 0 9px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:3px;color:var(--bg);font-weight:700;font-size:17px;letter-spacing:-.35px;flex-shrink:0;background:var(--side)}
.rank.gold{background:#ffd73f;color:#282315}.rank.silver{background:#cdd7e3;color:#1d2229}.rank.bronze{background:#f79a50;color:#2a1a0e}.rank svg{width:27px;height:27px;flex-shrink:0}
.level{height:36px;width:36px;display:flex;align-items:center;justify-content:center;border:4px solid var(--side);border-radius:50%;font-size:18px;font-weight:700;color:var(--side);margin:0 4px 0 12px;flex-shrink:0}
.statistics{height:96px;background:color-mix(in srgb,var(--text) 10%,var(--bg));border-radius:0 0 calc(var(--radius) * .6) calc(var(--radius) * .6);padding:9px 8px 10px;color:var(--muted)}
.scope{display:grid;grid-template-columns:114px 1fr;font-size:10px;line-height:12px;font-weight:700;margin-bottom:16px;text-transform:uppercase;letter-spacing:.6px}
.numbers{display:grid;grid-template-columns:104px 76px 128px 1fr;column-gap:0;min-width:0}
.stat{padding-left:10px;border-left:1px solid color-mix(in srgb,var(--text) 14%,transparent);min-width:0}.stat:first-child{padding-left:0;border:0}
.value{font-size:20px;line-height:24px;white-space:nowrap;color:var(--text);font-weight:500;letter-spacing:-.35px;font-variant-numeric:tabular-nums}.stat:nth-child(3) .value{font-size:19px}.stat:last-child .value{font-size:18px}
.label{font-size:10px;line-height:13px;margin-top:4px;font-weight:500;white-space:nowrap}.match-numbers{grid-template-columns:1.2fr 1fr 1fr}
svg{display:block}.symbol-library{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
{{template "intro-body" .}}
</html>
