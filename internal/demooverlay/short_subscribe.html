<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'none'"/>
<title>Like and subscribe</title>
<style>
@font-face{font-family:Roboto;src:url('{{.RegularFont}}') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Roboto;src:url('{{.MediumFont}}') format('truetype');font-weight:500;font-display:block}
@font-face{font-family:Roboto;src:url('{{.BoldFont}}') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:{{.Width}}px;height:{{.Height}}px;overflow:hidden;background:transparent}body{font-family:Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.row{position:relative;width:{{.Width}}px;height:{{.CellHeight}}px}
.card{position:absolute;top:50%;display:flex;align-items:center;white-space:nowrap;background:#0f0f0fe6;border:2px solid #ffffff24;box-shadow:0 10px 28px #0009}
.portrait .card{left:50%;transform:translate(-50%,-50%);height:100px;gap:16px;padding:0 14px;border-radius:50px}
.landscape .card{right:44px;transform:translateY(-50%);height:76px;gap:12px;padding:0 10px;border-radius:38px}
.logo{border-radius:50%;object-fit:cover;flex-shrink:0;background:#000}
.portrait .logo{width:72px;height:72px}.landscape .logo{width:56px;height:56px}
.name{font-weight:700;color:#f1f1f1;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.portrait .name{font-size:34px}.landscape .name{font-size:26px}
.like,.sub{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.like{border-radius:50%;background:#272727}
.portrait .like{width:72px;height:72px}.landscape .like{width:56px;height:56px}
.like.liked{box-shadow:inset 0 0 0 3px #3ea6ff}
.thumb{color:#fff}.liked .thumb{color:#3ea6ff}
.portrait .thumb{width:38px;height:38px}.landscape .thumb{width:30px;height:30px}
.sub{gap:12px;font-weight:700;text-transform:uppercase;color:#fff;background:#ff0033;letter-spacing:1.5px;box-shadow:0 6px 18px #ff003366}
.portrait .sub{height:72px;min-width:330px;padding:0 28px;border-radius:36px;font-size:30px}
.landscape .sub{height:56px;min-width:270px;padding:0 22px;border-radius:28px;font-size:23px}
.sub.subscribed{color:#f1f1f1;background:#3a3a3a;box-shadow:none}
.bell{flex-shrink:0;transform-origin:50% 12%}
.portrait .bell{width:36px;height:36px}.landscape .bell{width:28px;height:28px}
.ripple{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border-radius:50%;background:#fff}
</style>
</head>
<body class="{{.Layout}}">{{range .Frames}}<div class="row"><div class="card">{{if $.Logo}}<img class="logo" src="{{$.Logo}}" alt=""/>{{end}}{{if $.ChannelName}}<span class="name">{{$.ChannelName}}</span>{{end}}<div class="like{{if .Liked}} liked{{end}}">{{if .LikeRipple}}<div class="ripple" style="{{.LikeRipple}}"></div>{{end}}<svg class="thumb" style="{{.Thumb}}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 10h4v11H2z"/><path d="M8 10.4l4.3-6.9c.45-.72 1.45-.86 2.07-.27.43.4.6 1.02.44 1.59L13.7 9H20a2 2 0 0 1 1.97 2.35l-1.3 7.6A2.5 2.5 0 0 1 18.2 21H8z"/></svg></div><div class="sub{{if .Subscribed}} subscribed{{end}}" style="{{.Sub}}">{{if .SubRipple}}<div class="ripple" style="{{.SubRipple}}"></div>{{end}}<svg class="bell" style="{{.Bell}}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5a1.5 1.5 0 0 0-1.5 1.5v.6A6 6 0 0 0 6 10.5v4.2l-1.6 2.4a.9.9 0 0 0 .75 1.4h13.7a.9.9 0 0 0 .75-1.4L18 14.7v-4.2a6 6 0 0 0-4.5-5.9V4A1.5 1.5 0 0 0 12 2.5z"/><path d="M9.6 20a2.5 2.5 0 0 0 4.8 0z"/></svg><span>{{if .Subscribed}}{{$.Done}}{{else}}{{$.Label}}{{end}}</span></div></div></div>{{end}}</body>
</html>
